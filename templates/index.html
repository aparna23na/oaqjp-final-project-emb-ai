<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Emotion Detector</h1>
        <p>Enter a statement and the application will report the emotion scores and the dominant emotion.</p>
        <textarea id="textToAnalyze" class="form-control mb-3" rows="4" placeholder="Type your statement here"></textarea>
        <button class="btn btn-primary" onclick="RunSentimentAnalysis()">Run Emotion Analysis</button>
        <div id="system_response" class="mt-4"></div>
    </div>
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
